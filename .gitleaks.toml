# Gitleaks configuration for WireHop.
#
# Extends the default rules; the allowlist below documents every intentional
# exception. Adding an entry requires a justification comment.

[extend]
useDefault = true

[allowlist]
description = "Reviewed, intentional exceptions"
paths = [
    # crates/hop-cli/src/oauth.rs — two reviewed matches, neither a leak:
    #  1. Google Desktop-app OAuth client pair (embedded by design; Google
    #     does not treat installed-app client secrets as confidential — PKCE
    #     is the protection. Standard OSS pattern: rclone, gcloud. Overridable
    #     via HOP_GOOGLE_CLIENT_ID/SECRET. Decision 2026-08-23; reassess if
    #     the client goes through Google restricted-scope verification.)
    #  2. Synthetic sk-ant-oat01 test fixture exercising the setup-token
    #     output parser.
    '''crates/hop-cli/src/oauth\.rs''',
]
