# Nightly long soak: hours of randomized faults against one long-lived
# founder/member pair (tests/e2e/long-soak.sh, docs/technical/self-healing.md).
# It catches what only shows up over time — a recovery that is slow one time in
# twenty, a restart that stacks a duplicate daemon, slow memory growth — none of
# which the per-push gates run long enough to see.
#
# Needs no secret: the containers use the public relay. Runs on a native arm64
# runner (free on public repositories) so the containers run the binary built
# here without a cross-build. Same private-mirror guard as ci.yml.

name: soak

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC nightly
  workflow_dispatch:
    inputs:
      hours:
        description: Soak length in hours (the job is capped at 6 h)
        default: "4"

concurrency:
  group: soak
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  long-soak:
    if: github.repository != 'thedracle/hop'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: soak-arm64

      - name: Build release binary
        run: cargo build --release -p hop-cli

      - name: Long soak
        shell: bash
        env:
          SOAK_HOURS: ${{ github.event.inputs.hours || '4' }}
        run: |
          set -euo pipefail
          HOP_BIN="$PWD/target/release/hop" HOP_DUMP_LOGS="$RUNNER_TEMP/soak-logs" \
            ./tests/e2e/long-soak.sh

      - name: Keep results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: long-soak-${{ github.run_id }}
          path: |
            tests/e2e/long-soak-results.md
            ${{ runner.temp }}/soak-logs
          if-no-files-found: ignore
          retention-days: 14
