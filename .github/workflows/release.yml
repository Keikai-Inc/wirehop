# Build, sign, notarize and publish a WireHop release from GitHub-hosted
# runners. Free for public repositories (macOS runners included).
#
# Triggered by pushing a tag:  git tag v0.9.33 && git push --tags
# Or manually via the Actions tab (workflow_dispatch).
#
# WHY THIS EXISTS: macOS scopes keychain unlocks per security session, so
# signing cannot run from a detached SSH/automation context on a workstation —
# it needed a human at a local console. A CI runner is a fresh machine with its
# own session, so it creates a throwaway keychain, imports the certs from
# secrets, and signs unattended. That is the whole reason releases were manual.
#
# ── Required repository secrets ──────────────────────────────────────────────
#   APPLE_CERT_APPLICATION_P12   base64 of the Developer ID *Application* .p12
#   APPLE_CERT_INSTALLER_P12     base64 of the Developer ID *Installer* .p12
#   APPLE_CERT_PASSWORD          password set when exporting those .p12 files
#   APPLE_TEAM_ID                e.g. S7U8BMQ98Y
#   APPLE_SIGN_IDENTITY          "Developer ID Application: NAME (TEAMID)"
#   APPLE_INSTALLER_IDENTITY     "Developer ID Installer: NAME (TEAMID)"
#   APPLE_API_KEY_P8             base64 of the App Store Connect .p8 key
#   APPLE_API_KEY_ID             the .p8 key id
#   APPLE_API_ISSUER_ID          App Store Connect issuer uuid
#   HOP_SIGNING_KEY_PEM          the RSA release-signing private key (PEM text)
#   HOP_GOOGLE_CLIENT_ID         Google Desktop-app OAuth client id
#   HOP_GOOGLE_CLIENT_SECRET     …and its secret (baked in obfuscated by
#                                crates/hop-cli/build.rs; NOT in the source)
#   AWS_ROLE_ARN                 IAM role for OIDC (no long-lived AWS keys)
#   CF_DISTRIBUTION_ID           CloudFront distribution id
#   NPM_TOKEN                    npm granular access token, read+write on
#                                @wirehop/wirehop. Optional: without it the
#                                npm step warns and skips rather than failing
#
# Export the .p12 files on the Mac that holds the certs:
#   security find-identity -v            # confirm both are present
#   # Keychain Access → My Certificates → right-click each → Export → .p12
#   base64 -i Application.p12 | pbcopy   # paste into the secret
#
# The App Store Connect API key (.p8) replaces the app-specific password used
# interactively: it is revocable on its own, scoped, and does not carry an
# Apple ID. Create at appstoreconnect.apple.com → Users and Access → Keys.
#
# ── Threat model for an open repo ────────────────────────────────────────────
# Fork pull requests CANNOT read these secrets: GitHub withholds secrets from
# `pull_request` runs from forks, and this workflow only triggers on tag pushes
# and manual dispatch — neither is available to an outside contributor.
#
# The residual risk is code that gets MERGED and then executes here during a
# release: a build.rs, a proc-macro, a new dependency, or an edit to
# pkg/build-pkg.sh runs on this runner with the signing key and AWS role
# present. Mitigations in force:
#   1. `environment: release` with a required reviewer — secrets are not issued
#      until a human approves the run (configure in Settings → Environments).
#   2. Third-party actions pinned to commit SHAs, not moving tags, so a
#      compromised upstream action cannot silently change what runs here.
#   3. NEVER add a `pull_request_target` workflow that checks out PR code —
#      that combination hands untrusted code a token with write access.
#   4. Review dependency and build-script changes in PRs with release
#      execution in mind, not just runtime behaviour.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.9.33)"
        required: true

permissions:
  contents: write   # create the GitHub release
  id-token: write   # AWS OIDC

jobs:
  # ── Linux binaries (x86_64 + arm64 + armv7) ────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: hop-linux-x86_64
            image: hop-cross-x86_64-musl
            dockerfile: docker/Dockerfile.x86_64-musl
          - target: aarch64-unknown-linux-musl
            name: hop-linux-arm64
            image: hop-cross-aarch64-musl-ci
            dockerfile: docker/Dockerfile.aarch64-musl-ci
          - target: armv7-unknown-linux-musleabihf
            name: hop-linux-armv7
            image: hop-cross-armv7-musl
            dockerfile: docker/Dockerfile.armv7-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # MUSL, not gnu. A glibc-linked binary only runs on distros with a glibc
      # at least as new as the builder's: v0.9.34 was built here against
      # Ubuntu 24.04 and would not start on Ubuntu 22.04, Debian 11, or Alpine
      # at all. Static musl runs everywhere, which is what a single downloadable
      # binary has to do. The stock cross images carry a GCC too old for
      # aws-lc-sys, hence the repo's own images.
      - name: Build cross image
        run: docker build -t ${{ matrix.image }} -f ${{ matrix.dockerfile }} .

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (musl)
        env:
          AWS_LC_SYS_CMAKE_BUILDER: "1"
          HOP_GOOGLE_CLIENT_ID: ${{ secrets.HOP_GOOGLE_CLIENT_ID }}
          HOP_GOOGLE_CLIENT_SECRET: ${{ secrets.HOP_GOOGLE_CLIENT_SECRET }}
        # All three targets go through cross against an image built above, so
        # there is one code path rather than a special case per arch. Uses
        # --release (full LTO) rather than the local release-cross profile:
        # QEMU segfaults on aws-lc-sys assembly under thin-LTO rebuilds.
        run: cross build --release --target ${{ matrix.target }} -p hop-cli

      - name: Stage + compress
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hop" "dist/${{ matrix.name }}"
          strip "dist/${{ matrix.name }}" 2>/dev/null || true
          # Keep an unpacked copy BEFORE upx. The UPX stub unpacks via
          # memfd_create(2) = Linux 3.17+, so the packed binary cannot start on
          # RHEL/CentOS 7 (3.10) at all. install.sh checks `uname -r` and fetches
          # this variant below 3.17; unpacked, the floor is tokio's 2.6.27.
          cp "dist/${{ matrix.name }}" "dist/${{ matrix.name }}-uncompressed"
          BEFORE=$(stat -c%s "dist/${{ matrix.name }}")
          # UPX cuts the static musl binaries ~72-76%, which is the difference
          # between a ~5MB and a ~20MB download. `upx -t` self-tests the packed
          # binary; a bad pack must fail the release, not ship.
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
          upx --best --lzma "dist/${{ matrix.name }}" >/dev/null
          upx -t "dist/${{ matrix.name }}" >/dev/null
          AFTER=$(stat -c%s "dist/${{ matrix.name }}")
          echo "${{ matrix.name }}: $BEFORE -> $AFTER bytes"

      # The gate that would have caught v0.9.34. Assert the binary actually
      # STARTS on an old-glibc distro and on musl-only Alpine, rather than
      # trusting that the target triple was right.
      #
      # SCOPE, precisely: containers share the HOST kernel, so this proves
      # USERSPACE/libc independence -- that the binary needs no ld.so and no
      # libc version from the distro. It says nothing about old KERNELS. A
      # kernel-compatibility claim needs a VM with that kernel, and is not
      # tested anywhere in this pipeline.
      - name: Verify it runs on old distros
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-*)  PLAT=linux/amd64 ;;
            aarch64-*) PLAT=linux/arm64 ;;
            # armv7 IS executable here via qemu-user through binfmt; an earlier
            # version of this gate skipped it, which would have let a broken
            # armv7 build ship unnoticed while the other two were verified.
            armv7-*)   PLAT=linux/arm/v7 ;;
          esac
          docker run --rm --privileged \
            tonistiigi/binfmt@sha256:66e11bea77a5ea9d6f0fe79b57cd2b189b5d15b93a2bdb925be22949232e4e55 --install all >/dev/null 2>&1 || true
          # Assert the invariant directly, not just its symptom: a static
          # binary has no PT_INTERP segment. This catches a gnu/musl mix-up even
          # if every distro we happen to test is new enough to run it anyway.
          if readelf -l "dist/${{ matrix.name }}" 2>/dev/null | grep -q "Requesting program interpreter"; then
            echo "::error::${{ matrix.name }} is dynamically linked; expected static musl"
            readelf -l "dist/${{ matrix.name }}" | grep -A1 INTERP
            exit 1
          fi
          echo "  static: no PT_INTERP"
          EXPECTED="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          # BOTH variants must run: the packed one is what most users get, and
          # the uncompressed one is the only thing standing between an old-kernel
          # user and a binary that dies before main().
          for variant in "${{ matrix.name }}" "${{ matrix.name }}-uncompressed"; do
            for img in debian:11 alpine:3.20; do
              GOT="$(docker run --rm --platform "$PLAT" -v "$PWD/dist:/w:ro" "$img" \
                       "/w/$variant" --version 2>&1 | tail -1)"
              echo "  $variant on $img -> $GOT"
              case "$GOT" in
                "hop $EXPECTED") ;;
                *) echo "::error::$variant does not run on $img: $GOT"; exit 1 ;;
              esac
            done
          done
          # The uncompressed build exists to survive a kernel without
          # memfd_create. Prove that directly rather than trusting the label:
          # seccomp ENOSYS is what an old kernel does.
          cat > /tmp/nomemfd.json <<'SECCOMP'
          { "defaultAction": "SCMP_ACT_ALLOW",
            "syscalls": [ { "names": ["memfd_create"], "action": "SCMP_ACT_ERRNO", "errnoRet": 38 } ] }
          SECCOMP
          sed -i 's/^          //' /tmp/nomemfd.json
          GOT="$(docker run --rm --platform "$PLAT" --security-opt seccomp=/tmp/nomemfd.json \
                   -v "$PWD/dist:/w:ro" debian:11 \
                   "/w/${{ matrix.name }}-uncompressed" --version 2>&1 | tail -1)"
          echo "  uncompressed, memfd_create blocked -> $GOT"
          case "$GOT" in
            "hop $EXPECTED") ;;
            *) echo "::error::uncompressed build still needs memfd_create: $GOT"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/

  # ── macOS binaries + signed, notarized .pkg installers ─────────────────────
  macos:
    # macos-14 is Apple Silicon; both slices cross-compile from it.
    runs-on: macos-14
    # Secrets are scoped to this environment. Configure it in repo Settings →
    # Environments → "release" with a REQUIRED REVIEWER (you): the job then
    # pauses for explicit approval before any signing credential is exposed.
    # This is the backstop against merged-then-released supply-chain code —
    # a tag push alone cannot reach the certs.
    environment: release
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-${{ matrix.arch }}

      - name: Build binary
        env:
          HOP_GOOGLE_CLIENT_ID: ${{ secrets.HOP_GOOGLE_CLIENT_ID }}
          HOP_GOOGLE_CLIENT_SECRET: ${{ secrets.HOP_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            arm64)  TARGET=aarch64-apple-darwin; NAME=hop-darwin-arm64 ;;
            x86_64) TARGET=x86_64-apple-darwin;  NAME=hop-darwin-x86_64 ;;
          esac
          cargo build --release --target "$TARGET" -p hop-cli
          mkdir -p dist
          cp "target/$TARGET/release/hop" "dist/$NAME"
          strip "dist/$NAME" 2>/dev/null || true

      # Fail fast and legibly. Without this, a missing secret surfaces as an
      # opaque `security import` or "no identity found" error several minutes
      # into the job, which reads like a broken keychain rather than an unset
      # secret. Names only are printed; values are never echoed.
      - name: Check required secrets are present
        env:
          CERT_APP: ${{ secrets.APPLE_CERT_APPLICATION_P12 }}
          CERT_INST: ${{ secrets.APPLE_CERT_INSTALLER_P12 }}
          CERT_PASS: ${{ secrets.APPLE_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.APPLE_SIGN_IDENTITY }}
          INST_ID: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          set -uo pipefail
          missing=""
          for n in CERT_APP CERT_INST CERT_PASS SIGN_ID INST_ID; do
            eval "v=\${$n:-}"
            [ -n "$v" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required signing secrets:$missing"
            echo "Run ./scripts/setup-ci-secrets.sh from the Mac holding the certs."
            echo "Secret names map to: APPLE_CERT_APPLICATION_P12, APPLE_CERT_INSTALLER_P12,"
            echo "APPLE_CERT_PASSWORD, APPLE_SIGN_IDENTITY, APPLE_INSTALLER_IDENTITY."
            exit 1
          fi
          echo "All signing secrets present."

      # A throwaway keychain: created, unlocked, and used within this job, then
      # discarded with the runner. set-key-partition-list is what stops codesign
      # from blocking on a GUI prompt — the step that makes this unattended.
      - name: Import signing certificates
        env:
          CERT_APP: ${{ secrets.APPLE_CERT_APPLICATION_P12 }}
          CERT_INST: ${{ secrets.APPLE_CERT_INSTALLER_P12 }}
          CERT_PASS: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$CERT_APP"  | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$CERT_INST" | base64 --decode > "$RUNNER_TEMP/inst.p12"
          for f in app inst; do
            security import "$RUNNER_TEMP/$f.p12" -k "$KEYCHAIN" -P "$CERT_PASS" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so codesign/productbuild find the identities,
          # WITHOUT dropping the ones already there (losing the login keychain
          # mid-job breaks anything else that needs it). Collected into an array
          # rather than relying on word splitting; macOS runners are bash 3.2,
          # so `mapfile` is not available.
          EXISTING=()
          while IFS= read -r kc; do
            [ -n "$kc" ] && EXISTING+=("$kc")
          done < <(security list-keychains -d user | tr -d '"' | sed 's/^ *//;s/ *$//')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/inst.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Two accepted credential shapes, so this is not blocked on creating an
      # App Store Connect key. The .p8 API key is preferred (scoped, revocable
      # on its own, carries no Apple ID); an app-specific password is the
      # fallback and is what an existing local `notarytool store-credentials`
      # setup already uses.
      - name: Store notarization credentials
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${KEY_P8:-}" ]; then
            echo "Using App Store Connect API key"
            echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
            xcrun notarytool store-credentials wirehop-notary \
              --key "$RUNNER_TEMP/asc.p8" --key-id "$KEY_ID" --issuer "$ISSUER"
            rm -f "$RUNNER_TEMP/asc.p8"
          elif [ -n "${APPLE_APP_PASSWORD:-}" ]; then
            echo "Using Apple ID + app-specific password"
            xcrun notarytool store-credentials wirehop-notary \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID"
          else
            echo "::error::No notarization credentials. Set APPLE_API_KEY_P8 (+ KEY_ID, ISSUER)" \
                 "or APPLE_ID + APPLE_APP_PASSWORD + APPLE_TEAM_ID."
            exit 1
          fi

      - name: Build signed + notarized .pkg
        env:
          HOP_CODESIGN_ID: ${{ secrets.APPLE_SIGN_IDENTITY }}
          HOP_INSTALLER_ID: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          HOP_NOTARY_PROFILE: wirehop-notary
        run: ./pkg/build-pkg.sh --arch ${{ matrix.arch }} --binary-dir dist

      - name: Verify Gatekeeper acceptance
        run: |
          set -euo pipefail
          PKG=$(ls target/pkg-staging/output/*.pkg)
          # `spctl --assess` is SILENT on success unless -v/-vv is passed, and
          # writes its verdict to stderr. Grepping the output of a bare
          # invocation therefore finds nothing and fails a package that was in
          # fact accepted -- which is exactly what happened on the first CI
          # release. Capture the verbose output once and assert on it.
          OUT="$(spctl --assess --type install -vv "$PKG" 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q 'accepted' \
            || { echo "::error::Gatekeeper rejected $PKG"; exit 1; }
          # Signed-but-not-notarized still says accepted on a machine that has
          # the cert; assert the notarized source explicitly.
          echo "$OUT" | grep -q 'source=Notarized Developer ID' \
            || { echo "::error::$PKG is not notarized"; exit 1; }
          cp "$PKG" dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/

  # ── Sign artifacts, publish to S3 + GitHub Releases ────────────────────────
  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    # Same gate: holds the RSA release key and the AWS role.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: staged
      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          ls -la dist/

      # Detached RSA signatures over every binary — install.sh verifies these
      # against the public key embedded in it, and FAILS CLOSED without them.
      - name: Sign binaries + checksums
        env:
          SIGNING_KEY: ${{ secrets.HOP_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          echo "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          cd dist
          for f in hop-linux-* hop-darwin-*; do
            case "$f" in *.sha256|*.sig|*.pkg) continue ;; esac
            shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
            openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out "$f.sig" "$f"
            openssl dgst -sha256 -verify <(openssl rsa -in "$RUNNER_TEMP/key.pem" -pubout 2>/dev/null) \
              -signature "$f.sig" "$f"
          done
          rm -f "$RUNNER_TEMP/key.pem"

      # Print the OIDC subject before assuming the role. "Not authorized to
      # perform sts:AssumeRoleWithWebIdentity" says nothing about WHY, and the
      # sub is not what the docs imply: GitHub now issues an immutable form
      # carrying numeric org/repo ids
      # (repo:Owner@<orgid>/repo@<repoid>:environment:name), so an IAM trust
      # policy written against the documented repo:Owner/repo form silently
      # never matches. The sub is not a secret; the token is, and is not shown.
      - name: Show OIDC subject (for trust-policy debugging)
        run: |
          set -euo pipefail
          TOKEN="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          CLAIMS="$(printf '%s' "$TOKEN" | cut -d. -f2)"
          # base64url -> base64, pad, decode.
          CLAIMS="$(printf '%s' "$CLAIMS" | tr '_-' '/+')"
          while [ $(( ${#CLAIMS} % 4 )) -ne 0 ]; do CLAIMS="${CLAIMS}="; done
          echo "OIDC sub: $(printf '%s' "$CLAIMS" | base64 -d 2>/dev/null | jq -r .sub)"
          echo "OIDC aud: $(printf '%s' "$CLAIMS" | base64 -d 2>/dev/null | jq -r .aud)"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3 + invalidate CDN
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.version }}" ] && VERSION="${{ inputs.version }}"
          aws s3 cp dist/ "s3://hop-releases/v${VERSION}/" --recursive --no-progress
          printf '%s' "$VERSION" > latest
          aws s3 cp latest s3://hop-releases/latest --no-progress
          aws s3 cp install.sh s3://hop-releases/install.sh --no-progress
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}" --paths "/*"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.version }}" ] && VERSION="${{ inputs.version }}"
          # Quoted heredoc: the body is literal markdown, so the backticks are
          # not command substitution and $VERSION is substituted by sed after.
          cat > "$RUNNER_TEMP/notes.md" <<'MD'
          WireHop vVERSION_PLACEHOLDER — single binary `hop`.

          ```bash
          curl -fsSL https://wirehop.org/install.sh | bash
          ```

          Installers are **signed and notarized**; binaries carry `.sha256` and
          `.sig` sidecars verified by `install.sh`.
          MD
          # Strip the YAML block indentation, then fill in the version.
          sed -i '' -e 's/^          //' -e "s/VERSION_PLACEHOLDER/${VERSION}/" \
            "$RUNNER_TEMP/notes.md" 2>/dev/null \
            || sed -i -e 's/^          //' -e "s/VERSION_PLACEHOLDER/${VERSION}/" \
                 "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" dist/* \
            --title "WireHop v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release upload "v${VERSION}" dist/* --clobber

      # npm LAST, deliberately: the postinstall downloads from
      # <cdn>/v<package.json version>/, so the artifacts must already be on S3
      # or a fresh install of the new version 404s. Publishing here rather than
      # by hand is also what stops npm drifting behind the releases, which it
      # did (npm sat on 0.9.33 while the CDN served 0.9.36, so `npx` handed
      # people stale binaries).
      - name: Publish npm wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN not set, skipping npm publish."
            echo "Create a granular access token scoped to @wirehop/wirehop with"
            echo "read+write, then: gh secret set NPM_TOKEN"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.version }}" ] && VERSION="${{ inputs.version }}"

          cd npm
          # The wrapper's version IS the download path, so it must match the
          # release rather than whatever is committed.
          node -e '
            const fs=require("fs"), p="package.json";
            const d=JSON.parse(fs.readFileSync(p));
            d.version=process.argv[1];
            fs.writeFileSync(p, JSON.stringify(d,null,2)+"\n");
          ' "$VERSION"

          if npm view "@wirehop/wirehop@${VERSION}" version >/dev/null 2>&1; then
            echo "@wirehop/wirehop@${VERSION} already published, nothing to do."
            exit 0
          fi

          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --access public
          rm -f ~/.npmrc

          # Confirm what the registry actually serves, rather than trusting that
          # publish succeeded.
          for _ in $(seq 1 10); do
            GOT="$(npm view "@wirehop/wirehop@${VERSION}" version 2>/dev/null || true)"
            [ "$GOT" = "$VERSION" ] && { echo "npm now serves ${GOT}"; exit 0; }
            sleep 6
          done
          echo "::error::published but the registry does not report ${VERSION}"
          exit 1
