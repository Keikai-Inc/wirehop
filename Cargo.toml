[workspace]
members = ["crates/hop-cli", "crates/hop-core", "crates/hop-mcp"]
resolver = "2"

[workspace.package]
version = "0.5.22"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
# Internal
hop-core = { path = "crates/hop-core" }
hop-mcp = { path = "crates/hop-mcp" }

# Networking
iroh = { git = "https://github.com/thedracle/iroh.git", branch = "hop-relay-fix" }

# Async runtime
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "signal"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# Terminal / PTY
portable-pty = "0.9"
crossterm = "0.28"
ratatui = "0.29"

# Crypto / Auth
rand = "0.9"
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# Config
directories = "5"

# Error handling & logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System
libc = "0.2"
nix = { version = "0.29", features = ["user", "net", "term", "signal", "process", "fs"] }
users = "0.11"
hostname = "0.4"
filetime = "0.2"
landlock = "0.4"

# Compression & Hashing
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Datastore
redb = "2"
cron = "0.13"

# Testing
tempfile = "3"

# Patch iroh-quinn to fix panic on drained connections under heavy stream load.
# See vendor/iroh-quinn/src/connection.rs:287 — replaces unreachable!() with
# graceful LocallyClosed fallback. Filed upstream: quinn-rs/quinn.
[patch.crates-io]
iroh-quinn = { path = "vendor/iroh-quinn" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Faster profile for Linux cross-compilation (QEMU + native arm64 Docker).
# Thin LTO allows parallel codegen, reducing emulated build times significantly.
# ~5% larger binaries than full LTO — acceptable tradeoff for CLI tools.
[profile.release-cross]
inherits = "release"
lto = "thin"
codegen-units = 4
