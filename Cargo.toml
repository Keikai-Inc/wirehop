[workspace]
members = ["crates/hop-cli", "crates/hop-core", "crates/hop-mcp"]
resolver = "2"

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
# Internal
hop-core = { path = "crates/hop-core" }
hop-mcp = { path = "crates/hop-mcp" }

# Networking
iroh = { git = "https://github.com/thedracle/iroh.git", branch = "hop-relay-fix" }

# Async runtime
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "signal"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# Terminal / PTY
portable-pty = "0.9"
crossterm = "0.28"
ratatui = "0.29"

# Crypto / Auth
rand = "0.9"
argon2 = "0.5"
base64 = "0.22"
hex = "0.4"

# Config
directories = "5"

# Error handling & logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System
libc = "0.2"

# Compression & Hashing
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Datastore
redb = "2"
cron = "0.13"

# Testing
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
