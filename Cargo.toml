[workspace]
members = ["crates/hop-cli", "crates/hop-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal
hop-core = { path = "crates/hop-core" }

# Networking
iroh = "0.96"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "2"

# Terminal / PTY
portable-pty = "0.9"
crossterm = "0.28"

# Web UI
axum = "0.8"

# Crypto / Auth
rand = "0.9"
argon2 = "0.5"
base64 = "0.22"

# Config
directories = "5"

# Error handling & logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
