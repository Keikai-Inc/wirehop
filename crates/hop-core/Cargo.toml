[package]
name = "hop-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hop-vt.workspace = true
iroh.workspace = true
# Relay SERVER (the `server` feature) for `hop host --relay` — a member-only BYO
# relay. iroh already pulls iroh-relay's CLIENT; this adds the server. Redirected
# to the fork by [patch.crates-io] in the workspace root.
iroh-relay = { version = "0.97", default-features = false, features = ["server"] }
iroh-docs.workspace = true
iroh-gossip.workspace = true
iroh-blobs.workspace = true
tokio.workspace = true
futures-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
toml.workspace = true
ipc-channel.workspace = true
portable-pty.workspace = true
crossterm.workspace = true
rand.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
sha2.workspace = true
base64.workspace = true
hex.workspace = true
directories.workspace = true
anyhow.workspace = true
tracing.workspace = true
libc = { workspace = true }
nix = { workspace = true }
users = { workspace = true }
hostname = { workspace = true }
filetime = { workspace = true }
zstd = { workspace = true }
xxhash-rust = { workspace = true }
redb = { workspace = true }
cron = { workspace = true }
# Force reqwest to use pure-Rust hickory-resolver instead of libc getaddrinfo.
# musl's DNS resolver is minimal and fails on TXT lookups / certain AAAA+A combos.
# Feature unification merges this with iroh's reqwest 0.12 dependency.
reqwest = { version = "0.12", default-features = false, features = ["hickory-dns", "rustls-tls"] }
bytes = "1.11.1"
# default-features off drops the `ipaddr` extension (hop's reach policies use no
# IP attributes); keep `decimal` + `datetime` as a hedge for future tag policies.
cedar-policy = { version = "4.11.0", default-features = false, features = ["decimal", "datetime"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[target."cfg(unix)".dependencies]
tun = { version = "0.8.10", features = ["async"] }

[dev-dependencies]
tempfile = { workspace = true }
