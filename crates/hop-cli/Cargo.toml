[package]
name = "hop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hop"
path = "src/main.rs"

[dependencies]
hop-core.workspace = true
hop-mcp.workspace = true
# Wire types for the `hop <host> tap` verb. Tiny crate (just serde
# derives), zero transitive cost. The verb is purely additive: if the
# user doesn't have hop-tap installed on the target, they just get an
# "extension not available" error from the hop daemon.
hop-tap-protocol = { path = "../../vendor/hop-tap-protocol" }
iroh.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
hex.workspace = true
libc.workspace = true
users.workspace = true
cron.workspace = true
rand.workspace = true
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64.workspace = true
dhat = { version = "0.3", optional = true }

[features]
# Heap-profile the daemon: build with `--features dhat-heap`, run the daemon,
# generate traffic, then SIGTERM it — writes dhat-heap.json (live bytes by
# allocation call-site). For pinning the multipath/forwarding leak.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
tempfile.workspace = true
sha2 = "0.10"
